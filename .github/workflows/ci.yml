name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
      
      - name: Create Neon branch for PR
        id: neon-branch
        if: github.event_name == 'pull_request'
        uses: neondatabase/create-branch-action@v4
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch_name: pr-${{ github.event.pull_request.number }}
          parent: main
          api_key: ${{ secrets.NEON_API_KEY }}
          
      - name: Run linter
        run: npm run lint
        
      - name: Run type check
        run: npx tsc --noEmit
        
      - name: Run unit tests
        run: npm test -- --coverage
        env:
          DATABASE_URL: ${{ steps.neon-branch.outputs.db_url || secrets.NEON_DATABASE_URL }}
          
      - name: Comment on PR with Neon branch details
        if: github.event_name == 'pull_request' && success()
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `## 🚀 Neon Database Branch Created
            
            A dedicated Neon database branch has been created for this PR.
            
            **Branch**: \`pr-${{ github.event.pull_request.number }}\`
            **Connection String**: \`${{ steps.neon-branch.outputs.db_url }}\`
            
            ### Testing
            This branch is automatically used for:
            - Unit tests
            - Build verification
            - E2E tests (if configured)
            
            ### Cleanup
            The branch will be automatically deleted when this PR is merged or closed.
            
            ---
            *Powered by [Neon](https://neon.tech) branching*`;
            
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });
            
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella

  build:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
      
      - name: Create Neon branch for PR
        id: neon-branch
        if: github.event_name == 'pull_request'
        uses: neondatabase/create-branch-action@v4
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch_name: pr-${{ github.event.pull_request.number }}
          parent: main
          api_key: ${{ secrets.NEON_API_KEY }}
          
      - name: Build application
        run: npm run build
        env:
          DATABASE_URL: ${{ steps.neon-branch.outputs.db_url || secrets.NEON_DATABASE_URL }}
          
      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build
          path: .next/