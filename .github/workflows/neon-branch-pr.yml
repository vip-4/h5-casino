name: Neon Branch for PR

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

jobs:
  create-neon-branch:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Create Neon branch
        id: create-branch
        uses: neondatabase/create-branch-action@v4
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch_name: pr-${{ github.event.pull_request.number }}
          parent: main
          api_key: ${{ secrets.NEON_API_KEY }}
          
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const branchDetails = `## 🚀 Neon Database Branch Created
            
            A dedicated Neon database branch has been created for this PR.
            
            **Branch**: \`pr-${{ github.event.pull_request.number }}\`
            **Connection String**: \`${{ steps.create-branch.outputs.db_url }}\`
            
            ### Testing
            This branch is automatically used for:
            - Unit tests
            - Build verification
            - E2E tests (if configured)
            
            ### Cleanup
            The branch will be automatically deleted when this PR is merged or closed.
            
            ---
            *Powered by [Neon](https://neon.tech) branching*`;
            
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: branchDetails
            });
            
      - name: Set branch URL as output
        run: echo "BRANCH_DB_URL=${{ steps.create-branch.outputs.db_url }}" >> $GITHUB_OUTPUT